# The analyse-agentic-system plan for the artifact-run engine.
# File inputs are relative to the library root recorded by start_run.
# Criteria groups expand into ordinary file inputs of the jobs that list
# them; each stays a live, pinned rerun trigger (scenario 8). Code checks
# own their type/schema closure; model jobs keep the input names their
# instructions use. Opening consumes the fixed run parameters system,
# source-identity, source and optional source-revision. Assembly and
# publication are gated by the engine's coverage input; publication reads
# assembly's pinned manifest and writes a receipt.
type: agentic-system-analyses/types/agentic-system-analysis-set.md
criteria:
  worker:
    collection: agentic-system-analyses/COLLECTION.md
    sources-contract: agentic-system-analyses/instructions/agentic-analysis-sources.md
    worker-rules: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/follow-worker-rules.md
  check:
    sources-contract: agentic-system-analyses/instructions/agentic-analysis-sources.md
    records-contract: agentic-system-analyses/instructions/agentic-analysis-records.md
    note-schema: types/note.schema.yaml
    note-base-schema: types/note-base.schema.yaml
    boundary-type: agentic-system-analyses/types/agentic-system-boundary.md
    boundary-schema: agentic-system-analyses/types/agentic-system-boundary.schema.yaml
    overview-schema: agentic-system-analyses/types/agentic-system-analysis-overview.schema.yaml
    set-schema: agentic-system-analyses/types/agentic-system-analysis-set.schema.yaml
  reports:
    runtime-type: agentic-system-analyses/types/agentic-system-runtime-report.md
    runtime-schema: agentic-system-analyses/types/agentic-system-runtime-report.schema.yaml
    memory-type: agentic-system-analyses/types/agentic-system-memory-report.md
    memory-schema: agentic-system-analyses/types/agentic-system-memory-report.schema.yaml
    epistemic-type: agentic-system-analyses/types/agentic-system-epistemic-report.md
    epistemic-schema: agentic-system-analyses/types/agentic-system-epistemic-report.schema.yaml
  reconciliation:
    reconciliation-type: agentic-system-analyses/types/agentic-system-reconciliation-report.md
    reconciliation-schema: agentic-system-analyses/types/agentic-system-reconciliation-report.schema.yaml
  verification:
    verification-type: agentic-system-analyses/types/agentic-system-verification.md
    verification-schema: agentic-system-analyses/types/agentic-system-verification.schema.yaml
  profile:
    memory-profile-type: agentic-system-analyses/types/agentic-system-memory-profile.md
    memory-profile-schema: agentic-system-analyses/types/agentic-system-memory-profile.schema.yaml
  synthesis:
    synthesis-type: agentic-system-analyses/types/agentic-system-synthesis.md
    synthesis-schema: agentic-system-analyses/types/agentic-system-synthesis.schema.yaml
  publication:
    collection: agentic-system-analyses/COLLECTION.md
    validation-contract: reference/validation-contract.md
    boundary-contract: agentic-system-analyses/instructions/agentic-analysis-boundary.md
    note-type: types/note.md
    overview-type: agentic-system-analyses/types/agentic-system-analysis-overview.md
    type-spec: types/type-spec.md
    type-spec-schema: types/type-spec.schema.yaml
jobs:
- name: open
  kind: code
  handler: commonplace.lib.agentic_analysis.opening.open_analysis
  inputs:
    worker-profiles: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/worker-profiles.yaml}
  outputs: [metadata]
- name: acquire
  kind: code
  handler: commonplace.lib.agentic_analysis.opening.acquire_analysis
  inputs:
    metadata: {address: output, source: 'open:metadata', required: true}
  outputs: [source]
- name: boundary
  kind: model
  role: boundary
  instruction: instruction
  max-attempts: 2
  outputs: [boundary]
  criteria: [worker]
  inputs:
    instruction: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/declare-boundary.md}
    boundary-result-contract: {address: file, source: agentic-system-analyses/types/agentic-system-boundary.md}
    boundary-contract: {address: file, source: agentic-system-analyses/instructions/agentic-analysis-boundary.md}
    opening: {address: output, source: 'open:metadata', required: true}
    source: {address: output, source: 'acquire:source', required: true}
    refusal: {address: refusal, source: boundary, required: false}
  parameters: {system: '{param:system}', validation-artifact: '{artifact}', validation-role: boundary}
- name: check-boundary
  kind: code
  handler: commonplace.lib.agentic_analysis.opening.check_boundary
  criteria: [check]
  inputs:
    candidate: {address: output, source: 'boundary:boundary', required: true}
    incumbent-boundary: {address: role, source: boundary, required: false}
    metadata: {address: output, source: 'open:metadata', required: true}
    producer-attempt: {address: attempt, source: boundary, required: true}
    answered-refusal: {address: handed, source: 'producer-attempt:refusal', required: false}
    source: {address: output, source: 'acquire:source', required: true}
    note-type: {address: file, source: types/note.md}
  outputs: []
- name: runtime
  kind: model
  role: runtime
  instruction: instruction
  max-attempts: 3
  outputs: [report, answers]
  criteria: [worker]
  inputs:
    instruction: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/trace-runtime.md}
    opening: {address: output, source: 'open:metadata', required: true}
    records-contract: {address: file, source: agentic-system-analyses/instructions/agentic-analysis-records.md}
    runtime-contract: {address: file, source: agentic-system-analyses/types/agentic-system-runtime-report.md}
    boundary: {address: role, source: boundary, required: true}
    refusal: {address: refusal, source: runtime, required: false}
  parameters: {system: '{param:system}', validation-artifact: '{artifact}', validation-role: runtime}
- name: check-runtime
  kind: code
  handler: commonplace.lib.agentic_analysis.opening.check_runtime
  criteria: [check, reports]
  inputs:
    candidate: {address: output, source: 'runtime:report', required: true}
    incumbent-report: {address: role, source: runtime, required: false}
    note-type: {address: file, source: types/note.md}
    producer-attempt: {address: attempt, source: runtime, required: true}
    answered-refusal: {address: handed, source: 'producer-attempt:refusal', required: false}
    boundary: {address: role, source: boundary, required: true}
    epistemic: {address: role, source: epistemic, required: false}
    memory: {address: role, source: memory, required: false}
    answers: {address: output, source: 'runtime:answers', required: false}
  outputs: []
- name: memory
  kind: model
  role: memory
  instruction: instruction
  max-attempts: 3
  outputs: [report, answers]
  criteria: [worker]
  inputs:
    instruction: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/analyse-memory.md}
    opening: {address: output, source: 'open:metadata', required: true}
    records-contract: {address: file, source: agentic-system-analyses/instructions/agentic-analysis-records.md}
    memory-contract: {address: file, source: agentic-system-analyses/types/agentic-system-memory-report.md}
    boundary: {address: role, source: boundary, required: true}
    refusal: {address: refusal, source: memory, required: false}
    runtime: {address: role, source: runtime, order-only: true}
  parameters: {system: '{param:system}', validation-artifact: '{artifact}', validation-role: memory}
- name: check-memory
  kind: code
  handler: commonplace.lib.agentic_analysis.opening.check_memory
  criteria: [check, reports]
  inputs:
    candidate: {address: output, source: 'memory:report', required: true}
    incumbent-report: {address: role, source: memory, required: false}
    note-type: {address: file, source: types/note.md}
    metadata: {address: output, source: 'open:metadata', required: true}
    producer-attempt: {address: attempt, source: memory, required: true}
    answered-refusal: {address: handed, source: 'producer-attempt:refusal', required: false}
    boundary: {address: role, source: boundary, required: true}
    epistemic: {address: role, source: epistemic, required: false}
    runtime: {address: role, source: runtime, required: false}
    answers: {address: output, source: 'memory:answers', required: false}
  outputs: []
- name: epistemic
  kind: model
  role: epistemic
  instruction: instruction
  max-attempts: 3
  outputs: [report, answers]
  criteria: [worker]
  inputs:
    instruction: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/trace-epistemic.md}
    opening: {address: output, source: 'open:metadata', required: true}
    records-contract: {address: file, source: agentic-system-analyses/instructions/agentic-analysis-records.md}
    epistemic-contract: {address: file, source: agentic-system-analyses/types/agentic-system-epistemic-report.md}
    boundary: {address: role, source: boundary, required: true}
    refusal: {address: refusal, source: epistemic, required: false}
    runtime: {address: role, source: runtime, order-only: true}
  parameters: {system: '{param:system}', validation-artifact: '{artifact}', validation-role: epistemic}
- name: check-epistemic
  kind: code
  handler: commonplace.lib.agentic_analysis.opening.check_epistemic
  criteria: [check, reports]
  inputs:
    candidate: {address: output, source: 'epistemic:report', required: true}
    incumbent-report: {address: role, source: epistemic, required: false}
    note-type: {address: file, source: types/note.md}
    producer-attempt: {address: attempt, source: epistemic, required: true}
    answered-refusal: {address: handed, source: 'producer-attempt:refusal', required: false}
    boundary: {address: role, source: boundary, required: true}
    memory: {address: role, source: memory, required: false}
    runtime: {address: role, source: runtime, required: false}
    answers: {address: output, source: 'epistemic:answers', required: false}
  outputs: []
- name: reconcile
  kind: model
  role: reconciliation
  instruction: instruction
  max-attempts: 3
  outputs: [reconciliation]
  criteria: [worker]
  inputs:
    instruction: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/reconcile-records.md}
    opening: {address: output, source: 'open:metadata', required: true}
    records-contract: {address: file, source: agentic-system-analyses/instructions/agentic-analysis-records.md}
    runtime-contract: {address: file, source: agentic-system-analyses/types/agentic-system-runtime-report.md}
    memory-contract: {address: file, source: agentic-system-analyses/types/agentic-system-memory-report.md}
    epistemic-contract: {address: file, source: agentic-system-analyses/types/agentic-system-epistemic-report.md}
    reconciliation-contract: {address: file, source: agentic-system-analyses/types/agentic-system-reconciliation-report.md}
    boundary: {address: role, source: boundary, required: true}
    runtime: {address: role, source: runtime, required: true}
    memory: {address: role, source: memory, required: true}
    epistemic: {address: role, source: epistemic, required: true}
    refusal: {address: refusal, source: reconcile, required: false}
  parameters: {system: '{param:system}', validation-artifact: '{artifact}', validation-role: reconciliation}
- name: check-reconcile
  kind: code
  handler: commonplace.lib.agentic_analysis.verification.check_reconcile
  criteria: [check, reports, reconciliation]
  inputs:
    candidate: {address: output, source: 'reconcile:reconciliation', required: true}
    producer-attempt: {address: attempt, source: reconcile, required: true}
    answered-refusal: {address: handed, source: 'producer-attempt:refusal', required: false}
    boundary: {address: role, source: boundary, required: true}
    epistemic: {address: role, source: epistemic, required: true}
    memory: {address: role, source: memory, required: true}
    runtime: {address: role, source: runtime, required: true}
  outputs: []
- name: report-check
  kind: code
  handler: commonplace.lib.agentic_analysis.verification.record_check
  outputs: [findings]
  criteria: [check, reports, reconciliation]
  inputs:
    boundary: {address: role, source: boundary}
    runtime: {address: role, source: runtime}
    memory: {address: role, source: memory}
    epistemic: {address: role, source: epistemic}
    reconciliation: {address: role, source: reconciliation}
- name: verify
  kind: model
  role: report-verification
  instruction: instruction
  max-attempts: 3
  outputs: [verification]
  criteria: [worker]
  inputs:
    instruction: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/verify-reports.md}
    opening: {address: output, source: 'open:metadata', required: true}
    records-contract: {address: file, source: agentic-system-analyses/instructions/agentic-analysis-records.md}
    boundary-contract: {address: file, source: agentic-system-analyses/instructions/agentic-analysis-boundary.md}
    runtime-contract: {address: file, source: agentic-system-analyses/types/agentic-system-runtime-report.md}
    memory-contract: {address: file, source: agentic-system-analyses/types/agentic-system-memory-report.md}
    epistemic-contract: {address: file, source: agentic-system-analyses/types/agentic-system-epistemic-report.md}
    reconciliation-contract: {address: file, source: agentic-system-analyses/types/agentic-system-reconciliation-report.md}
    report-verification-contract: {address: file, source: agentic-system-analyses/types/agentic-system-verification.md}
    boundary: {address: role, source: boundary, required: true}
    runtime: {address: role, source: runtime, required: true}
    memory: {address: role, source: memory, required: true}
    epistemic: {address: role, source: epistemic, required: true}
    reconciliation: {address: role, source: reconciliation, required: true}
    runtime-answers: {address: output, source: 'runtime:answers', required: false}
    memory-answers: {address: output, source: 'memory:answers', required: false}
    epistemic-answers: {address: output, source: 'epistemic:answers', required: false}
    refusal: {address: refusal, source: verify, required: false}
    report-check: {address: output, source: 'report-check:findings'}
  parameters: {system: '{param:system}', validation-artifact: '{artifact}', validation-role: report-verification}
- name: apply-verify
  kind: code
  handler: commonplace.lib.agentic_analysis.verification.apply_verify
  criteria: [check, reports, reconciliation, verification]
  inputs:
    candidate: {address: output, source: 'verify:verification', required: true}
    verifier-attempt: {address: attempt, source: verify, required: true}
    boundary-handed: {address: handed, source: 'verifier-attempt:boundary', required: true}
    runtime-handed: {address: handed, source: 'verifier-attempt:runtime', required: true}
    memory-handed: {address: handed, source: 'verifier-attempt:memory', required: true}
    epistemic-handed: {address: handed, source: 'verifier-attempt:epistemic', required: true}
    reconciliation-handed: {address: handed, source: 'verifier-attempt:reconciliation', required: true}
    report-check-handed: {address: handed, source: 'verifier-attempt:report-check'}
    answered-refusal: {address: handed, source: 'verifier-attempt:refusal', required: false}
  outputs: []
- name: profile
  kind: model
  role: memory-profile
  instruction: instruction
  max-attempts: 3
  outputs: [profile, answers]
  criteria: [worker]
  inputs:
    instruction: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/map-memory-profile.md}
    opening: {address: output, source: 'open:metadata', required: true}
    records-contract: {address: file, source: agentic-system-analyses/instructions/agentic-analysis-records.md}
    memory-profile-contract: {address: file, source: agentic-system-analyses/types/agentic-system-memory-profile.md}
    boundary: {address: role, source: boundary, required: true}
    runtime: {address: role, source: runtime, required: true}
    memory: {address: role, source: memory, required: true}
    epistemic: {address: role, source: epistemic, required: true}
    reconciliation: {address: role, source: reconciliation, required: true}
    runtime-verified: {address: judgment, source: runtime, required: true, relation: 'report-verification:verifies:runtime', outcome: accepted}
    memory-verified: {address: judgment, source: memory, required: true, relation: 'report-verification:verifies:memory', outcome: accepted}
    epistemic-verified: {address: judgment, source: epistemic, required: true, relation: 'report-verification:verifies:epistemic', outcome: accepted}
    reconciliation-verified: {address: judgment, source: reconciliation, required: true, relation: 'report-verification:verifies:reconciliation', outcome: accepted}
    refusal: {address: refusal, source: profile, required: false}
  parameters: {system: '{param:system}', validation-artifact: '{artifact}', validation-role: memory-profile}
- name: check-profile
  kind: code
  handler: commonplace.lib.agentic_analysis.profile.check_profile
  criteria: [check, reports, reconciliation, profile]
  inputs:
    candidate: {address: output, source: 'profile:profile', required: true}
    answers: {address: output, source: 'profile:answers', required: false}
    reconciliation: {address: role, source: reconciliation, required: true}
    producer-attempt: {address: attempt, source: profile, required: true}
    answered-refusal: {address: handed, source: 'producer-attempt:refusal', required: false}
    boundary: {address: role, source: boundary, required: true}
    epistemic: {address: role, source: epistemic, required: true}
    memory: {address: role, source: memory, required: true}
    runtime: {address: role, source: runtime, required: true}
  outputs: []
- name: verify-profile
  kind: model
  role: profile-verification
  instruction: instruction
  max-attempts: 3
  outputs: [verification, answers]
  criteria: [worker]
  inputs:
    instruction: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/verify-memory-profile.md}
    opening: {address: output, source: 'open:metadata', required: true}
    profile-answers: {address: output, source: 'profile:answers', required: false}
    profile-refusal: {address: refusal, source: profile, required: false}
    records-contract: {address: file, source: agentic-system-analyses/instructions/agentic-analysis-records.md}
    memory-profile-contract: {address: file, source: agentic-system-analyses/types/agentic-system-memory-profile.md}
    profile-verification-contract: {address: file, source: agentic-system-analyses/types/agentic-system-verification.md}
    boundary: {address: role, source: boundary, required: true}
    runtime: {address: role, source: runtime, required: true}
    memory: {address: role, source: memory, required: true}
    epistemic: {address: role, source: epistemic, required: true}
    reconciliation: {address: role, source: reconciliation, required: true}
    profile: {address: role, source: memory-profile, required: true}
    refusal: {address: refusal, source: verify-profile, required: false}
  parameters: {system: '{param:system}', validation-artifact: '{artifact}', validation-role: profile-verification}
- name: apply-verify-profile
  kind: code
  handler: commonplace.lib.agentic_analysis.profile.apply_verify_profile
  criteria: [check, reports, reconciliation, verification, profile]
  inputs:
    answers: {address: output, source: 'verify-profile:answers', required: false}
    answered-refusal: {address: handed, source: 'verifier-attempt:refusal', required: false}
    candidate: {address: output, source: 'verify-profile:verification', required: true}
    verifier-attempt: {address: attempt, source: verify-profile, required: true}
    boundary-handed: {address: handed, source: 'verifier-attempt:boundary', required: true}
    runtime-handed: {address: handed, source: 'verifier-attempt:runtime', required: true}
    memory-handed: {address: handed, source: 'verifier-attempt:memory', required: true}
    epistemic-handed: {address: handed, source: 'verifier-attempt:epistemic', required: true}
    reconciliation-handed: {address: handed, source: 'verifier-attempt:reconciliation', required: true}
    memory-profile-handed: {address: handed, source: 'verifier-attempt:profile', required: true}
  outputs: []
- name: synthesize
  kind: model
  role: synthesis
  instruction: instruction
  max-attempts: 2
  outputs: [synthesis, answers]
  criteria: [worker]
  inputs:
    instruction: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/synthesize-analysis.md}
    opening: {address: output, source: 'open:metadata', required: true}
    records-contract: {address: file, source: agentic-system-analyses/instructions/agentic-analysis-records.md}
    synthesis-contract: {address: file, source: agentic-system-analyses/types/agentic-system-synthesis.md}
    boundary: {address: role, source: boundary, required: true}
    runtime: {address: role, source: runtime, required: true}
    memory: {address: role, source: memory, required: true}
    epistemic: {address: role, source: epistemic, required: true}
    reconciliation: {address: role, source: reconciliation, required: true}
    memory-profile: {address: role, source: memory-profile, required: true}
    report-verification: {address: role, source: report-verification, required: true}
    profile-verification: {address: role, source: profile-verification, required: true}
    runtime-verified: {address: judgment, source: runtime, required: true, relation: 'report-verification:verifies:runtime', outcome: accepted}
    memory-verified: {address: judgment, source: memory, required: true, relation: 'report-verification:verifies:memory', outcome: accepted}
    epistemic-verified: {address: judgment, source: epistemic, required: true, relation: 'report-verification:verifies:epistemic', outcome: accepted}
    reconciliation-verified: {address: judgment, source: reconciliation, required: true, relation: 'report-verification:verifies:reconciliation', outcome: accepted}
    profile-verified: {address: judgment, source: memory-profile, required: true, relation: 'profile-verification:verifies:memory-profile', outcome: accepted}
    refusal: {address: refusal, source: synthesize, required: false}
  parameters: {system: '{param:system}', validation-artifact: '{artifact}', validation-role: synthesis}
- name: check-synthesize
  kind: code
  handler: commonplace.lib.agentic_analysis.profile.check_synthesize
  criteria: [check, reports, reconciliation, verification, synthesis]
  inputs:
    candidate: {address: output, source: 'synthesize:synthesis', required: true}
    answers: {address: output, source: 'synthesize:answers', required: false}
    reconciliation: {address: role, source: reconciliation, required: true}
    report-verification: {address: role, source: report-verification, required: true}
    profile-verification: {address: role, source: profile-verification, required: true}
    producer-attempt: {address: attempt, source: synthesize, required: true}
    answered-refusal: {address: handed, source: 'producer-attempt:refusal', required: false}
    boundary: {address: role, source: boundary, required: true}
    epistemic: {address: role, source: epistemic, required: true}
    memory: {address: role, source: memory, required: true}
    runtime: {address: role, source: runtime, required: true}
  outputs: []
- name: verify-synthesis
  kind: model
  role: synthesis-verification
  instruction: instruction
  max-attempts: 2
  outputs: [verification, answers]
  criteria: [worker]
  inputs:
    instruction: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/verify-synthesis.md}
    opening: {address: output, source: 'open:metadata', required: true}
    synthesis-answers: {address: output, source: 'synthesize:answers', required: false}
    synthesis-refusal: {address: refusal, source: synthesize, required: false}
    records-contract: {address: file, source: agentic-system-analyses/instructions/agentic-analysis-records.md}
    synthesis-contract: {address: file, source: agentic-system-analyses/types/agentic-system-synthesis.md}
    synthesis-verification-contract: {address: file, source: agentic-system-analyses/types/agentic-system-verification.md}
    boundary: {address: role, source: boundary, required: true}
    runtime: {address: role, source: runtime, required: true}
    memory: {address: role, source: memory, required: true}
    epistemic: {address: role, source: epistemic, required: true}
    reconciliation: {address: role, source: reconciliation, required: true}
    synthesis: {address: role, source: synthesis, required: true}
    report-verification: {address: role, source: report-verification, required: true}
    profile-verification: {address: role, source: profile-verification, required: true}
    refusal: {address: refusal, source: verify-synthesis, required: false}
  parameters: {system: '{param:system}', validation-artifact: '{artifact}', validation-role: synthesis-verification}
- name: apply-verify-synthesis
  kind: code
  handler: commonplace.lib.agentic_analysis.profile.apply_verify_synthesis
  criteria: [check, reports, reconciliation, verification, synthesis]
  inputs:
    answers: {address: output, source: 'verify-synthesis:answers', required: false}
    answered-refusal: {address: handed, source: 'verifier-attempt:refusal', required: false}
    candidate: {address: output, source: 'verify-synthesis:verification', required: true}
    verifier-attempt: {address: attempt, source: verify-synthesis, required: true}
    boundary-handed: {address: handed, source: 'verifier-attempt:boundary', required: true}
    runtime-handed: {address: handed, source: 'verifier-attempt:runtime', required: true}
    memory-handed: {address: handed, source: 'verifier-attempt:memory', required: true}
    epistemic-handed: {address: handed, source: 'verifier-attempt:epistemic', required: true}
    reconciliation-handed: {address: handed, source: 'verifier-attempt:reconciliation', required: true}
    synthesis-handed: {address: handed, source: 'verifier-attempt:synthesis', required: true}
    report-verification-handed: {address: handed, source: 'verifier-attempt:report-verification', required: true}

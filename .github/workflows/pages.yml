name: Deploy KB to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          tool-bin-dir: ${{ runner.temp }}/uv-tool-bin

      - name: Publish uv tool commands
        run: echo "${{ runner.temp }}/uv-tool-bin" >> "$GITHUB_PATH"

      - name: Install editable Commonplace tool
        run: uv tool install --python 3.11 --editable .

      - name: Verify Commonplace command discovery
        run: commonplace-validate --help

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: uv run --extra docs properdocs build --clean --site-dir site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

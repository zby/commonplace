$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "../../types/note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required:
          - description
          - source
          - captured
          - capture
          - genre
          - snapshot_sha256
          - ingested
          - type
          - domains
        properties:
          type:
            const: kb/sources/types/ingest-report.md
          source:
            type: string
            pattern: "^https?://"
          captured:
            anyOf:
              - type: string
                format: date
                pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
              - type: string
                format: date-time
                pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt].+$"
          capture:
            type: string
            minLength: 1
          genre:
            severity: warn
            enum:
              - scientific-paper
              - practitioner-report
              - conceptual-essay
              - design-proposal
              - tool-announcement
              - github-issue
              - conversation-thread
              - code-repository
              - court-opinion
              - news-article
              - official-statement
          snapshot_sha256:
            type: string
            pattern: "^[0-9a-f]{64}$"
          source_snapshot: false
          ingested:
            type: string
            format: date
          source_type: false
          domains:
            type: array
            minItems: 2
            maxItems: 4
            items:
              type: string
              minLength: 1
          code_revisions: false
          secondary_sources:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: object
              required:
                - role
                - source
              properties:
                role:
                  const: implementation
                source:
                  type: string
                  pattern: "^https://github\\.com/[^/]+/[^/]+/commit/[0-9a-f]{40}$"
              additionalProperties: false
        additionalProperties: true
      headings:
        type: array
        allOf:
          - contains:
              const: "## Classification"
          - contains:
              const: "## Summary"
          - contains:
              const: "## Connections Found"
          - contains:
              const: "## Extractable Value"
          - contains:
              const: "## Limitations (our opinion)"
          - contains:
              const: "## Recommended Next Action"
  - if:
      properties:
        frontmatter:
          required:
            - secondary_sources
    then:
      properties:
        headings:
          contains:
            const: "## Code Grounding"

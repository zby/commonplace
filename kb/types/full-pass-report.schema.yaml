$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "./note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required:
          - description
          - type
          - note
          - start-sha256
          - final-sha256
          - run
          - disposition
          - update
          - merge-target
          - merge-target-sha256
          - closing-status
          - repaired
          - resolution
          - resolved-at
          - resolution-authority
          - resolution-summary
          - resolution-rationale
          - resulting-paths
        properties:
          type:
            const: types/full-pass-report.md
          note:
            type: string
            pattern: '^[^/].*\.md$'
          start-sha256:
            type: string
            pattern: '^[0-9a-f]{64}$'
          final-sha256:
            type: string
            pattern: '^[0-9a-f]{64}$'
          run:
            type: string
            minLength: 1
          disposition:
            enum: [keep, revise, delete, merge, rehome]
          update:
            enum: [determined, undetermined, none]
          merge-target:
            type: [string, "null"]
          merge-target-sha256:
            anyOf:
              - type: "null"
              - type: string
                pattern: '^[0-9a-f]{64}$'
          closing-status:
            enum: [ready, hand-back, null]
          repaired:
            type: boolean
          resolution:
            enum: [not-required, pending, accepted, rejected, alternative-applied, superseded]
          resolved-at:
            type: [string, "null"]
          resolution-authority:
            enum: [user, version-guard, null]
          resolution-summary:
            type: [string, "null"]
          resolution-rationale:
            type: [string, "null"]
          resulting-paths:
            type: array
            uniqueItems: true
            items:
              type: string
        additionalProperties: true
  - if:
      properties:
        frontmatter:
          properties:
            disposition:
              const: merge
    then:
      properties:
        frontmatter:
          properties:
            merge-target:
              type: string
              minLength: 1
            merge-target-sha256:
              type: string
    else:
      properties:
        frontmatter:
          properties:
            merge-target:
              const: null
            merge-target-sha256:
              const: null
  - if:
      properties:
        frontmatter:
          properties:
            closing-status:
              enum: [ready, hand-back]
    then:
      properties:
        frontmatter:
          properties:
            disposition:
              const: keep
            update:
              const: determined
  - if:
      properties:
        frontmatter:
          properties:
            resolution:
              const: not-required
    then:
      properties:
        frontmatter:
          properties:
            closing-status:
              const: ready
  - if:
      properties:
        frontmatter:
          properties:
            resolution:
              enum: [not-required, pending]
    then:
      properties:
        frontmatter:
          properties:
            resolved-at:
              const: null
            resolution-authority:
              const: null
            resolution-summary:
              const: null
            resolution-rationale:
              const: null
            resulting-paths:
              maxItems: 0
    else:
      properties:
        frontmatter:
          properties:
            resolved-at:
              type: string
              minLength: 1
              format: date-time
            resolution-summary:
              type: string
              minLength: 1
              pattern: '^[^\r\n]+$'
            resolution-rationale:
              type: string
              minLength: 1
              pattern: '^[^\r\n]+$'
  - if:
      properties:
        frontmatter:
          properties:
            resolution:
              const: superseded
    then:
      properties:
        frontmatter:
          properties:
            resolution-authority:
              const: version-guard
    else:
      if:
        properties:
          frontmatter:
            properties:
              resolution:
                enum: [accepted, rejected, alternative-applied]
      then:
        properties:
          frontmatter:
            properties:
              resolution-authority:
                const: user

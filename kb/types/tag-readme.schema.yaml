$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "./note-base.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required:
          - description
          - type
        properties:
          type:
            const: types/tag-readme.md
          complete:
            type: boolean
          covered_by:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1
          # Identity is the filename (kb/tags/<tag>-README.md, ADR 089); the
          # retired index_source/index_key binding is rejected so a stale copy
          # cannot claim a second identity.
          index_source: false
          index_key: false
          status: false
        additionalProperties: true

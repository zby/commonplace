$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "./note-base.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required:
          - description
          - type
        properties:
          type:
            const: types/tag-readme.md
          complete:
            type: boolean
          # Retired fields are rejected by name so a stale copy cannot claim
          # the old relation or a second identity.
          covered_by:
            not: {}
            description: "covered_by is retired (ADR 090): link the child heads in the body; `complete` counts them"
          index_source:
            not: {}
            description: "index_source is retired (ADR 089): a head is identified by its filename under kb/tags/"
          index_key:
            not: {}
            description: "index_key is retired (ADR 089): a head is identified by its filename under kb/tags/"
          status: false
        additionalProperties: true

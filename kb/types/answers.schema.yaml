$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required: [frontmatter, body, headings]
properties:
  frontmatter:
    type: object
    additionalProperties: false
    required: [type, description, question, question-sha256, items]
    properties:
      type: {const: types/answers.md}
      description: {type: string, minLength: 1}
      question: {$ref: '#/$defs/path'}
      question-sha256: {$ref: '#/$defs/digest'}
      items:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [id, proposal, state]
          properties:
            id: {type: string, minLength: 1}
            proposal: {type: object, minProperties: 1}
            state: {enum: [pending, approved, rejected, deferred]}
            reason: {type: string, minLength: 1}
            revisit: {type: string, minLength: 1}
            decided-by: {const: operator}
            decided-at: {type: string, format: date-time}
            resolution: {type: string, minLength: 1}
            carried-from: {$ref: '#/$defs/path'}
            refs:
              type: array
              minItems: 1
              items: {type: string, minLength: 1}
          allOf:
            - if: {properties: {state: {const: pending}}}
              then:
                not: {anyOf: [{required: [decided-by]}, {required: [decided-at]}, {required: [resolution]}, {required: [refs]}, {required: [carried-from]}]}
              else: {required: [decided-by, decided-at]}
            - if: {properties: {state: {enum: [rejected, deferred]}}}
              then: {required: [reason]}
            - if: {properties: {state: {const: deferred}}}
              then: {required: [revisit]}
              else: {not: {required: [revisit]}}
  body: {type: string}
  headings:
    type: array
$defs:
  digest: {type: string, pattern: '^[0-9a-f]{64}$'}
  path: {type: string, minLength: 1, pattern: '^(?!/)(?!.*(?:^|/)\.\.(?:/|$))[^\\]+$'}

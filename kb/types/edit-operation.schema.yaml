$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "./note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required:
          - description
          - type
          - effort
          - decision
        properties:
          type:
            const: types/edit-operation.md
          effort:
            enum: [simple, judgment]
          decision:
            enum: [none, per-item]
          depth:
            type: integer
            minimum: 1
          responds-to:
            type: array
            minItems: 1
            items:
              type: string
              minLength: 1
        additionalProperties: true
      headings:
        type: array
        allOf:
          - contains:
              const: "## Steps"
          - contains:
              const: "## Report"
          - contains:
              const: "## Preserve"

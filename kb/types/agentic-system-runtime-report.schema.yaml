$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "./note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required: [description, type, run-id, reviewed-boundary]
        properties:
          type:
            const: types/agentic-system-runtime-report.md
          run-id:
            type: string
            pattern: '^AAS-\d{4}-\d{2}-\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*-\d{2}$'
          reviewed-boundary:
            type: string
            minLength: 1
        additionalProperties: true
      headings:
        description: "One H1, the three runtime sections in order, and the six record kinds under Shared records."
        type: array
        minItems: 10
        prefixItems:
          - pattern: '^# [^#].+$'
        items:
          anyOf:
            - enum:
                - "## Runtime account"
                # BACKCOMPAT: pinned retained analyses contain this section - remove after migration or retirement.
                - "## Probe evidence"
                - "## Shared records"
                - "## Annotations"
            - pattern: '^#{3,6} .+$'
        allOf:
          - {contains: {const: "## Runtime account"}, minContains: 1, maxContains: 1}
          - {contains: {const: "## Shared records"}, minContains: 1, maxContains: 1}
          - {contains: {const: "## Annotations"}, minContains: 1, maxContains: 1}
          - {contains: {const: "### Components"}, minContains: 1, maxContains: 1}
          - {contains: {const: "### Operative objects"}, minContains: 1, maxContains: 1}
          - {contains: {const: "### Routes"}, minContains: 1, maxContains: 1}
          - {contains: {const: "### Claims"}, minContains: 1, maxContains: 1}
          - {contains: {const: "### Evidenced absences"}, minContains: 1, maxContains: 1}
          - {contains: {const: "### Behavioral-authority paths"}, minContains: 1, maxContains: 1}
      body:
        allOf:
          - description: "The runtime sections must appear in their canonical reading order."
            pattern: '(?ms)^## Runtime account\s*$.*?^## Shared records\s*$.*?^## Annotations\s*$'
          - description: "Shared-record subheadings must appear under Shared records in canonical order."
            pattern: '(?ms)^## Shared records\s*$.*?^### Components\s*$.*?^### Operative objects\s*$.*?^### Routes\s*$.*?^### Claims\s*$.*?^### Evidenced absences\s*$.*?^### Behavioral-authority paths\s*$.*?(?=^## Annotations\s*$)'

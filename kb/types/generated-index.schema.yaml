$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "./note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required:
          - description
          - type
          - index_source
        properties:
          type:
            const: types/generated-index.md
          index_source:
            enum:
              - directory
          # Tag sources are retired (ADR 089): a tag head is identified by its
          # filename under kb/tags/ and carries no index binding.
          index_key: false
        additionalProperties: true

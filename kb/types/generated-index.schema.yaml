$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "./note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required:
          - description
          - type
          - index_source
        properties:
          type:
            const: types/generated-index.md
          index_source:
            enum:
              - directory
          index_key:
            not: {}
            description: "index_key is retired (ADR 089): tag heads live in kb/tags/ and carry no index binding"
        additionalProperties: true

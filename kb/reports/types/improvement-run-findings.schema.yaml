$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "../../types/note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required: [description, type, note, start-sha256, findings]
        properties:
          type:
            const: reports/types/improvement-run-findings.md
          note: {type: string, pattern: '^[^/].*\.md$'}
          start-sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
          findings:
            type: array
            items:
              type: object
              required: [atom, run, launch, output-sha256, text-sha256, outcome, disposition]
              additionalProperties: false
              properties:
                atom: {type: string, minLength: 1}
                run: {type: string, minLength: 1}
                launch: {type: string, minLength: 1}
                output-sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                text-sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                outcome: {enum: [pass, warn, fail, report]}
                finding: {type: string, minLength: 1}
                disposition: {enum: [fixed, open, none]}
                strategy: {type: string, minLength: 1}
                item: {type: string, pattern: '#.+$'}
              allOf:
                - if: {properties: {disposition: {const: fixed}}}
                  then: {required: [finding, strategy]}
                - if: {properties: {disposition: {const: open}}}
                  then: {required: [finding, item]}

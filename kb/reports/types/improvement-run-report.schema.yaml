$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "../../types/note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required: [description, type, note, variant, start-commit, start-sha256, started-at, ending, final-sha256, ended-at]
        properties:
          type:
            const: reports/types/improvement-run-report.md
          note: {type: string, pattern: '^[^/].*\.md$'}
          variant: {type: string, pattern: '\.md$'}
          start-commit: {type: string, pattern: '^[0-9a-f]{7,40}$'}
          start-sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
          started-at: {type: string, minLength: 1}
          ending: {enum: [open, stopped, applied, partly-applied]}
          final-sha256:
            anyOf: [{type: "null"}, {type: string, pattern: '^[0-9a-f]{64}$'}]
          ended-at: {type: [string, "null"]}
        if: {properties: {ending: {const: open}}}
        else:
          properties:
            final-sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
            ended-at: {type: string, minLength: 1}

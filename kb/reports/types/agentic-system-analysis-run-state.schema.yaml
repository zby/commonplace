$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "../../types/note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required:
          - type
          - description
          - run-id
          - system
          - run-status
          - result-disposition
          - source
          - result
          - generated-review
          - memory-review-required
          - legacy-review
          - legacy-review-model-partition
          - failure
        properties:
          type:
            const: kb/reports/types/agentic-system-analysis-run-state.md
          description:
            type: string
            minLength: 1
          run-id:
            type: string
            pattern: '^AAS-\d{4}-\d{2}-\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*-\d{2}$'
          system:
            type: string
            minLength: 1
            pattern: '\S'
          run-status:
            enum: [running, complete, failed]
          result-disposition:
            enum: [complete, blocked, out-of-scope, null]
          source:
            anyOf:
              - type: "null"
              - $ref: "#/$defs/source"
          result:
            anyOf:
              - type: "null"
              - $ref: "#/$defs/output"
          generated-review:
            anyOf:
              - type: "null"
              - $ref: "#/$defs/output"
          memory-review-required:
            type: [boolean, "null"]
          legacy-review:
            anyOf:
              - type: "null"
              - $ref: "#/$defs/output"
          legacy-review-model-partition:
            type: [string, "null"]
            minLength: 1
          failure:
            type: [string, "null"]
            minLength: 1
        additionalProperties: false
      headings:
        type: array
        allOf:
          - contains:
              const: "## Run"
            minContains: 1
            maxContains: 1
          - contains:
              const: "## Outcome"
            minContains: 1
            maxContains: 1
      body:
        pattern: '(?ms)^## Run\s*$.*?^## Outcome\s*$'
  - if:
      properties:
        frontmatter:
          properties:
            run-status:
              const: running
    then:
      properties:
        frontmatter:
          properties:
            result-disposition: {const: null}
            result: {const: null}
            generated-review: {const: null}
            memory-review-required: {const: null}
            legacy-review: {const: null}
            legacy-review-model-partition: {const: null}
            failure: {const: null}
  - if:
      properties:
        frontmatter:
          properties:
            run-status:
              const: failed
    then:
      properties:
        frontmatter:
          properties:
            result-disposition: {const: null}
            result: {const: null}
            generated-review: {const: null}
            memory-review-required: {const: null}
            legacy-review: {const: null}
            legacy-review-model-partition: {const: null}
            failure:
              type: string
              minLength: 1
  - if:
      properties:
        frontmatter:
          properties:
            run-status:
              const: complete
    then:
      properties:
        frontmatter:
          properties:
            result-disposition:
              enum: [complete, blocked, out-of-scope]
            result:
              $ref: "#/$defs/output"
            memory-review-required:
              type: boolean
            failure: {const: null}
  - if:
      properties:
        frontmatter:
          properties:
            run-status: {const: complete}
            result-disposition: {const: complete}
      required: [run-status, result-disposition]
    then:
      properties:
        frontmatter:
          properties:
            source:
              $ref: "#/$defs/source"
            generated-review:
              $ref: "#/$defs/output"
  - if:
      properties:
        frontmatter:
          properties:
            result-disposition:
              enum: [blocked, out-of-scope]
    then:
      properties:
        frontmatter:
          properties:
            generated-review: {const: null}
            memory-review-required: {const: false}
            legacy-review: {const: null}
  - if:
      properties:
        frontmatter:
          properties:
            memory-review-required: {const: true}
    then:
      properties:
        frontmatter:
          properties:
            legacy-review:
              $ref: "#/$defs/output"
            legacy-review-model-partition:
              type: string
              minLength: 1
    else:
      properties:
        frontmatter:
          properties:
            legacy-review: {const: null}
            legacy-review-model-partition: {const: null}
$defs:
  source:
    type: object
    required: [kind, identity, revision, path, sha256]
    properties:
      kind:
        enum: [git, capture]
      identity:
        type: string
        minLength: 1
      revision:
        type: string
        minLength: 1
      path:
        type: string
        minLength: 1
      sha256:
        anyOf:
          - type: "null"
          - type: string
            pattern: '^[0-9a-f]{64}$'
    additionalProperties: false
    allOf:
      - if:
          properties:
            kind: {const: git}
        then:
          properties:
            revision:
              pattern: '^(?:[0-9a-f]{40}|[0-9a-f]{64})$'
            sha256: {const: null}
        else:
          properties:
            sha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
  output:
    type: object
    required: [path, sha256]
    properties:
      path:
        type: string
        minLength: 1
      sha256:
        type: string
        pattern: '^[0-9a-f]{64}$'
    additionalProperties: false

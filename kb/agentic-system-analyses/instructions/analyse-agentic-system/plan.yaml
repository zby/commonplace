# The analyse-agentic-system plan for the artifact-run engine, in compact form.
# commonplace.artifactrun.compact expands it when a run starts: each role
# entry becomes its model job plus a derived check-<role>, or apply-<role>
# for a verifying role, whose partners, criteria and correction inputs come
# from the type's layout. Entries declare mission only: instruction, reads,
# gates, attempts and the analysis's own checks. Every model job also
# receives its member type, the types of the members it reads and the
# prompt section, which the engine renders into its prompt.
# Instructions and the prompt section are relative to this file; other file
# inputs are library paths. Opening, acquisition,
# assembly and publication are the analysis's own code jobs in the engine's
# full form. Opening consumes the run parameters system, source-identity,
# source and optional source-revision. Every model job prints system,
# command-path (the prepared checkout's command directory), source-identity
# and capture-directory as lines. Assembly and publication are gated by the
# engine's coverage input.
type: agentic-system-analyses/types/agentic-system-analysis-set.md
frozen-source: boundary
prompt-section: jobs-engine/prompt-section.md
criteria:
  worker:
    collection: agentic-system-analyses/COLLECTION.md
    worker-rules: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/follow-worker-rules.md
  # The contract the record-citing member types refer to; their writers and
  # every derived job receive it, the derived jobs with its own type.
  contracts:
    records-contract: agentic-system-analyses/instructions/agentic-analysis-records.md
  # Publication validates every member; these groups make its closure explicit.
  types:
    note-schema: types/note.schema.yaml
    note-base-schema: types/note-base.schema.yaml
    boundary-type: agentic-system-analyses/types/agentic-system-boundary.md
    boundary-schema: agentic-system-analyses/types/agentic-system-boundary.schema.yaml
    overview-schema: agentic-system-analyses/types/agentic-system-analysis-overview.schema.yaml
    set-schema: agentic-system-analyses/types/agentic-system-analysis-set.schema.yaml
  reports:
    runtime-type: agentic-system-analyses/types/agentic-system-runtime-report.md
    runtime-schema: agentic-system-analyses/types/agentic-system-runtime-report.schema.yaml
    memory-type: agentic-system-analyses/types/agentic-system-memory-report.md
    memory-schema: agentic-system-analyses/types/agentic-system-memory-report.schema.yaml
    epistemic-type: agentic-system-analyses/types/agentic-system-epistemic-report.md
    epistemic-schema: agentic-system-analyses/types/agentic-system-epistemic-report.schema.yaml
  reconciliation:
    reconciliation-type: agentic-system-analyses/types/agentic-system-reconciliation-report.md
    reconciliation-schema: agentic-system-analyses/types/agentic-system-reconciliation-report.schema.yaml
  verification:
    verification-type: agentic-system-analyses/types/agentic-system-verification.md
    verification-schema: agentic-system-analyses/types/agentic-system-verification.schema.yaml
  profile:
    memory-profile-type: agentic-system-analyses/types/agentic-system-memory-profile.md
    memory-profile-schema: agentic-system-analyses/types/agentic-system-memory-profile.schema.yaml
  synthesis:
    synthesis-type: agentic-system-analyses/types/agentic-system-synthesis.md
    synthesis-schema: agentic-system-analyses/types/agentic-system-synthesis.schema.yaml
  publication:
    collection: agentic-system-analyses/COLLECTION.md
    validation-contract: reference/validation-contract.md
    note-type: types/note.md
    overview-type: agentic-system-analyses/types/agentic-system-analysis-overview.md
    type-spec: types/type-spec.md
    type-spec-schema: types/type-spec.schema.yaml
inputs:
  opening: {address: output, source: 'opening:metadata'}
defaults:
  max-attempts: 3
  parameters: {system: '{param:system}', command-path: '{param:command-path}',
               source-identity: '{param:source-identity}', capture-directory: '{run}/sources'}
jobs:
- name: opening
  kind: code
  handler: commonplace.lib.agentic_analysis.opening.open_analysis
  inputs:
    worker-profiles: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/worker-profiles.yaml}
  outputs: [metadata]
- name: acquire
  kind: code
  handler: commonplace.lib.agentic_analysis.opening.acquire_analysis
  inputs:
    metadata: {address: output, source: 'opening:metadata'}
  outputs: [source]
- role: boundary
  instruction: jobs-engine/declare-boundary.md
  max-attempts: 2
  criteria: [worker]
  reads: {'acquire:source': required}
  checks:
  - function: commonplace.lib.agentic_analysis.declared_checks.bound_boundary
    inputs: {metadata: 'opening:metadata', source: 'acquire:source'}
- role: runtime
  instruction: jobs-engine/trace-runtime.md
  outputs: [report, answers]
  criteria: [worker, contracts]
  reads: {boundary: required}
- role: memory
  instruction: jobs-engine/analyse-memory.md
  outputs: [report, answers]
  criteria: [worker, contracts]
  reads: {boundary: required, runtime: order-only}
- role: epistemic
  instruction: jobs-engine/trace-epistemic.md
  outputs: [report, answers]
  criteria: [worker, contracts]
  reads: {boundary: required, runtime: order-only}
- role: reconciliation
  instruction: jobs-engine/reconcile-records.md
  criteria: [worker, contracts]
- job: report-check
  handler: commonplace.artifactrun.handlers.artifact_check
  inputs: [boundary, runtime, memory, epistemic, reconciliation]
- role: report-verification
  instruction: jobs-engine/verify-reports.md
  outputs: [verification]
  criteria: [worker, contracts]
  reads: {boundary: required, runtime: required, memory: required, epistemic: required,
          reconciliation: required, 'runtime:answers': optional, 'memory:answers': optional,
          'epistemic:answers': optional, 'report-check:findings': required}
  checks: [commonplace.lib.agentic_analysis.verification.report_check_gate]
  feedback: commonplace.lib.agentic_analysis.verification.cited_records
- role: memory-profile
  instruction: jobs-engine/map-memory-profile.md
  outputs: [profile, answers]
  criteria: [worker, contracts]
  reads: {boundary: required, runtime: required, memory: required, epistemic: required,
          reconciliation: required}
  verified-by: [report-verification]
  checks: [commonplace.lib.agentic_analysis.profile.comparison_version]
- role: profile-verification
  instruction: jobs-engine/verify-memory-profile.md
  outputs: [verification, answers]
  criteria: [worker, contracts]
  reads: {boundary: required, runtime: required, memory: required, epistemic: required,
          reconciliation: required, memory-profile: required, 'memory-profile:answers': optional,
          'refusal:memory-profile': optional}
- role: synthesis
  instruction: jobs-engine/synthesize-analysis.md
  max-attempts: 2
  outputs: [synthesis, answers]
  criteria: [worker, contracts]
  reads: {boundary: required, runtime: required, memory: required, epistemic: required,
          reconciliation: required, memory-profile: required, report-verification: required,
          profile-verification: required}
  verified-by: [report-verification, profile-verification]
- role: synthesis-verification
  instruction: jobs-engine/verify-synthesis.md
  max-attempts: 2
  outputs: [verification, answers]
  criteria: [worker, contracts]
  reads: {boundary: required, runtime: required, memory: required, epistemic: required,
          reconciliation: required, synthesis: required, report-verification: required,
          profile-verification: required, 'synthesis:answers': optional, 'refusal:synthesis': optional}
- name: assemble
  kind: code
  handler: commonplace.lib.agentic_analysis.publication.assemble_analysis
  role: overview
  criteria: [contracts, types, reports, reconciliation, verification, profile, synthesis, publication]
  inputs: &published
    coverage: {address: coverage}
    source: {address: output, source: 'acquire:source'}
    metadata: {address: output, source: 'opening:metadata'}
    boundary-attempt: {address: attempt, source: boundary}
    runtime-attempt: {address: attempt, source: runtime, required: false}
    memory-attempt: {address: attempt, source: memory, required: false}
    epistemic-attempt: {address: attempt, source: epistemic, required: false}
    reconciliation-attempt: {address: attempt, source: reconciliation, required: false}
    report-verification-attempt: {address: attempt, source: report-verification, required: false}
    memory-profile-attempt: {address: attempt, source: memory-profile, required: false}
    profile-verification-attempt: {address: attempt, source: profile-verification, required: false}
    synthesis-attempt: {address: attempt, source: synthesis, required: false}
    synthesis-verification-attempt: {address: attempt, source: synthesis-verification, required: false}
    boundary: {address: role, source: boundary}
    runtime: {address: role, source: runtime, required: false}
    memory: {address: role, source: memory, required: false}
    epistemic: {address: role, source: epistemic, required: false}
    reconciliation: {address: role, source: reconciliation, required: false}
    memory-profile: {address: role, source: memory-profile, required: false}
    synthesis: {address: role, source: synthesis, required: false}
    report-verification: {address: role, source: report-verification, required: false}
    profile-verification: {address: role, source: profile-verification, required: false}
    synthesis-verification: {address: role, source: synthesis-verification, required: false}
  outputs: [overview, manifest]
- name: publish
  kind: code
  handler: commonplace.lib.agentic_analysis.publication.publish_analysis
  criteria: [contracts, types, reports, reconciliation, verification, profile, synthesis, publication]
  inputs:
    <<: *published
    overview: {address: role, source: overview}
    manifest: {address: output, source: 'assemble:manifest'}
  outputs: [receipt]

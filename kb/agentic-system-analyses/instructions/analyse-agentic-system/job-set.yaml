# Opt-in analysis migration declaration. NOT a runnable analysis workflow.
# Every code handler fails closed; the live skill and CLI still use the legacy workflow.
# File inputs are relative to the library root recorded by start_run.
# Run parameters (currently system) are fixed at start; open will consume those,
# not run.json. Its repository/package checks and parameter API remain to be ported.
# Model contracts below are substantive authoring/judging inputs, not blanket
# validation dependencies. Code checks own type/schema dependency closure.
# Legacy round, requests/answers, previous-output and reading-order interfaces
# still need porting before these instructions can consume engine hand-outs.
# Assembly/publication must check disposition-dependent coverage at BOTH ends;
# optional coverage inputs express the alternatives, not permission to publish.
# Publication reads assembly's pinned manifest, not a second working-set copy.
type_spec: agentic-system-analyses/types/agentic-system-analysis-set.md
jobs:
- name: open
  kind: code
  handler: commonplace.lib.agentic_job_set.unported
  inputs: {}
  outputs:
  - metadata
- name: acquire

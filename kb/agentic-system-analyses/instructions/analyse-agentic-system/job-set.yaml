# Opt-in analysis declaration with translated model protocols and bound handlers.
# The live skill/CLI remain legacy. Binding is not production adoption or proof
# of whole-workflow coherence; do not launch workers from this declaration.
# File inputs are relative to the library root recorded by start_run.
# Opening consumes fixed system, source-identity, source and optional
# source-revision run parameters, not run.json. It requires a ready preparation
# record and the token-bearing run ID; legacy state must use the legacy workflow.
# Model contracts below are substantive authoring/judging inputs, not blanket
# validation dependencies. Code checks own type/schema dependency closure.
# Model jobs use opening metadata, pinned previous outputs and refusal feedback,
# not legacy rounds, requests, run-state or reading-order interfaces.
# Assembly/publication must check disposition-dependent coverage at BOTH ends;
# optional coverage inputs express the alternatives, not permission to publish.
# Publication reads assembly's pinned manifest, not a second working-set copy.
type_spec: agentic-system-analyses/types/agentic-system-analysis-set.md
jobs:
- name: open
  kind: code
  handler: commonplace.lib.agentic_analysis.handlers.open_analysis
  inputs: {}
  outputs:
  - metadata
- name: acquire
  kind: code
  handler: commonplace.lib.agentic_analysis.handlers.acquire_analysis
  inputs:
    metadata: {address: output, source: 'open:metadata', required: true}
  outputs:
  - source
- name: boundary
  kind: model
  role: boundary
  instruction: instruction
  max_attempts: 2
  outputs:
  - boundary
  inputs:
    instruction: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/fix-boundary.md}
    worker-rules: {address: file, source: agentic-system-analyses/instructions/analyse-agentic-system/jobs-engine/follow-worker-rules.md}
    collection: {address: file, source: agentic-system-analyses/COLLECTION.md}

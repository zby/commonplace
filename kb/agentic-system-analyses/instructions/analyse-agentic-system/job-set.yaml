  inputs:
    candidate: {address: output, source: 'boundary:boundary', required: true}
    # Preserve an already accepted capture when boundary prose is corrected.
    # First acceptance changes this input once; the next check settles its basis.
    incumbent-boundary: {address: member, source: boundary, required: false}
    metadata: {address: output, source: 'open:metadata', required: true}
    producer-attempt: {address: attempt, source: boundary, required: true}
    answered-refusal: {address: handed, source: 'producer-attempt:refusal', required: false}
    source: {address: output, source: 'acquire:source', required: true}
    boundary-type: {address: file, source: agentic-system-analyses/types/agentic-system-boundary.md}
    note-type: {address: file, source: types/note.md}
    agentic-system-analysis-overview-schema: {address: file, source: agentic-system-analyses/types/agentic-system-analysis-overview.schema.yaml}
    agentic-system-analysis-set-schema: {address: file, source: agentic-system-analyses/types/agentic-system-analysis-set.schema.yaml}

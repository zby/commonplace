# Worker profiles for analyse-agentic-system runs. A run names one profile
# when it starts; opening records it, and every analysis-role worker uses it.
# The Pi advisory auditor reuses its model and effort, not its extra flags.
# `launch-model` is the name the harness selects a model by, such as Claude
# Code's aliases, not a resolved version; the manifest records the model the
# harness reports. Optional `flags` are extra harness command-line flags, as
# `commonplace.headless.harness` builds them.
profiles:
  opus: {harness: claude-code, launch-model: opus, effort: medium}
  sonnet: {harness: claude-code, launch-model: sonnet, effort: medium}
  haiku: {harness: claude-code, launch-model: haiku, effort: medium}
  codex-sol: {harness: codex, launch-model: gpt-6.1-sol, effort: medium}
  codex-luna: {harness: codex, launch-model: gpt-6-luna, effort: medium}
  pi-sol: {harness: pi, launch-model: gpt-6.1-sol, effort: medium}
  pi-ultramarine: {harness: pi, launch-model: paperinstruments/ultramarine-1-flash, effort: "off"}
  pi-luna: {harness: pi, launch-model: gpt-6-luna, effort: medium}
  pi-luna-low: {harness: pi, launch-model: gpt-6-luna, effort: low}

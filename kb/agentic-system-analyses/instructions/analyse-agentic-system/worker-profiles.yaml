# Worker profiles for analyse-agentic-system runs. A run names one profile at
# start, or its harness's default; opening records it, and every worker of
# the run uses it.
defaults:
  claude-code: sonnet
  codex: codex-sol
  pi: pi-sol
profiles:
  opus: {harness: claude-code, model: claude-opus-5-5, effort: medium}
  sonnet: {harness: claude-code, model: claude-sonnet-5-5, effort: medium}
  haiku: {harness: claude-code, model: claude-haiku-5-5, effort: medium}
  codex-sol: {harness: codex, model: gpt-6.1-sol, effort: medium}
  codex-luna: {harness: codex, model: gpt-6-luna, effort: medium}
  pi-sol: {harness: pi, model: gpt-6.1-sol, effort: medium}
  pi-luna: {harness: pi, model: gpt-6-luna, effort: medium}

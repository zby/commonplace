{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$defs": {
    "text": {"type": "string", "minLength": 1, "pattern": "\\S"},
    "records": {
      "type": "array", "uniqueItems": true,
      "items": {"type": "string", "pattern": "^[a-z][a-z0-9-]*\\.md#(rt|mem|epi)-(cmp|obj|rte|clm|abs|bap)-[a-z][a-z0-9]*(-[a-z][a-z0-9]*){0,2}$",
                "description": "a record citation as a link destination: member.md#record-anchor"}
    },
    "assessment": {"enum": ["known", "partial", "absent", "inapplicable", "uninspected", "not-determinable"]},
    "finding": {
      "type": "object", "required": ["value", "basis", "records", "note"],
      "properties": {
        "value": {"$ref": "#/$defs/text"},
        "basis": {"enum": ["claimed", "afforded", "wired", "observed", "causally supported"]},
        "records": {"allOf": [{"$ref": "#/$defs/records"}, {"minItems": 1}]},
        "note": {"$ref": "#/$defs/text"}
      }, "additionalProperties": false
    },
    "coverage": {
      "if": {"properties": {"assessment": {"enum": ["known", "partial", "absent", "inapplicable"]}}},
      "then": {"properties": {"records": {"minItems": 1}}}
    },
    "unit": {
      "allOf": [
        {"$ref": "#/$defs/coverage"},
        {
          "if": {"properties": {"assessment": {"enum": ["known", "partial"]}}},
          "then": {"properties": {"findings": {"minItems": 1}}},
          "else": {"properties": {"findings": {"maxItems": 0}}}
        }
      ],
      "type": "object", "required": ["scope", "assessment", "findings", "records", "note"],
      "properties": {
        "scope": {"$ref": "#/$defs/text"},
        "assessment": {"$ref": "#/$defs/assessment"},
        "findings": {"type": "array", "items": {"$ref": "#/$defs/finding"}},
        "records": {"$ref": "#/$defs/records"},
        "note": {"$ref": "#/$defs/text"}
      }, "additionalProperties": false
    },
    "axis2": {
      "allOf": [
        {"$ref": "#/$defs/coverage"},
        {
          "if": {"properties": {"assessment": {"enum": ["known", "partial"]}}},
          "then": {"properties": {"units": {"minItems": 1}}}
        }
      ],
      "type": "object", "required": ["assessment", "units", "records", "note"],
      "properties": {
        "assessment": {"$ref": "#/$defs/assessment"},
        "units": {"type": "array", "items": {"$ref": "#/$defs/unit"}},
        "records": {"$ref": "#/$defs/records"},
        "note": {"$ref": "#/$defs/text"}
      }, "additionalProperties": false
    }
  },
  "allOf": [
    {
      "$ref": "../../types/note.schema.yaml"
    },
    {
      "type": "object",
      "properties": {
        "frontmatter": {
          "type": "object",
          "required": [
            "type",
            "description",
            "run-id",
            "source-identity",
            "reviewed-boundary",
            "memory-comparison"
          ],
          "properties": {
            "type": {
              "const": "agentic-system-analyses/types/agent-memory-profile.md"
            },
            "description": {
              "type": "string",
              "minLength": 1
            },
            "run-id": {
              "type": "string",
              "pattern": "^AAS-\\d{4}-\\d{2}-\\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*-\\d{2}$"
            },
            "source-identity": {
              "type": "string",
              "minLength": 1
            },
            "reviewed-boundary": {
              "type": "string",
              "minLength": 1
            },
            "memory-comparison": {
              "type": "object",
              "allOf": [
                {
                  "if": {"required": ["version"]},
                  "then": {"properties": {"axes": {"additionalProperties": {"$ref": "#/$defs/axis2"}}}},
                  "else": {"properties": {"axes": {"additionalProperties": {"required": ["values", "evidence"]}}}}
                }
              ],
              "required": [
                "scope",
                "axes"
              ],
              "properties": {
                "version": {"const": 2, "type": "integer"},
                "scope": {
                  "type": "string",
                  "minLength": 1
                },
                "axes": {
                  "type": "object",
                  "required": [
                    "storage_substrate",
                    "representational_form",
                    "lineage",
                    "behavioral_authority",
                    "write_agency",
                    "curation_operations",
                    "read_back_direction",
                    "read_back_signal",
                    "trace_learning",
                    "trace_source"
                  ],
                  "minProperties": 10,
                  "maxProperties": 10,
                  "additionalProperties": {
                    "oneOf": [
                    {"$ref": "#/$defs/axis2"},
                    {
                    "$comment": "BACKCOMPAT: immutable retained Dynamic Cheatsheet revision-1 profiles; remove after no retained or archived consumer needs revision 1.",
                    "type": "object",
                    "required": [
                      "assessment",
                      "evidence",
                      "values",
                      "records",
                      "note"
                    ],
                    "properties": {
                      "assessment": {
                        "enum": [
                          "known",
                          "partial",
                          "absent",
                          "inapplicable",
                          "uninspected",
                          "not-determinable"
                        ]
                      },
                      "values": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      },
                      "records": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      },
                      "note": {
                        "type": "string",
                        "minLength": 1
                      },
                      "evidence": {
                        "type": "object",
                        "additionalProperties": {
                          "type": "object",
                          "required": [
                            "basis",
                            "records",
                            "note"
                          ],
                          "properties": {
                            "basis": {
                              "enum": [
                                "claimed",
                                "afforded",
                                "wired",
                                "observed",
                                "causally supported"
                              ]
                            },
                            "records": {
                              "type": "array",
                              "minItems": 1,
                              "uniqueItems": true,
                              "items": {
                                "type": "string"
                              }
                            },
                            "note": {
                              "type": "string",
                              "minLength": 1
                            }
                          },
                          "additionalProperties": false
                        }
                      }
                    },
                    "additionalProperties": false
                    }
                    ]
                  }
                }
              },
              "additionalProperties": false
            }
          },
          "additionalProperties": false
        },
        "headings": {
          "type": "array",
          "allOf": [
            {
              "contains": {
                "const": "## Comparison rationale"
              },
              "minContains": 1,
              "maxContains": 1
            }
          ]
        }
      }
    }
  ]
}

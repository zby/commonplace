{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "allOf": [
    {
      "$ref": "../../types/note.schema.yaml"
    },
    {
      "type": "object",
      "properties": {
        "frontmatter": {
          "type": "object",
          "required": [
            "type",
            "description",
            "run-id",
            "source-identity",
            "reviewed-boundary"
          ],
          "properties": {
            "type": {
              "const": "agentic-system-analyses/types/agent-memory-analysis-report.md"
            },
            "description": {
              "type": "string",
              "minLength": 1
            },
            "run-id": {
              "type": "string",
              "pattern": "^AAS-\\d{4}-\\d{2}-\\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*-\\d{2}$"
            },
            "source-identity": {
              "type": "string",
              "minLength": 1
            },
            "reviewed-boundary": {
              "type": "string",
              "minLength": 1
            },
            "report-status": {
              "$comment": "BACKCOMPAT: retained memory members written before 2026-10-06 carry report-status: complete; remove after no retained or archived set has the field",
              "const": "complete"
            }
          },
          "additionalProperties": false
        },
        "headings": {
          "type": "array",
          "allOf": [
            {
              "contains": {
                "const": "## Boundary and evidence"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Core ideas"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Shared records"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Write side"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Read-back"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Integration issues"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Limitations and checks"
              },
              "minContains": 1,
              "maxContains": 1
            }
          ]
        }
      }
    }
  ]
}

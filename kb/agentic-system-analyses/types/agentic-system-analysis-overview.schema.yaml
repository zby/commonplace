$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "../../types/note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required:
          - description
          - type
          - run-id
          - system
          - run-date
          - result-disposition
          - target-class
          - boundary-kind
          - reviewed-boundary
          - analysis-cutoff
          - evidence-tier
          - inputs-commit
        properties:
          type:
            const: agentic-system-analyses/types/agentic-system-analysis-overview.md
          run-id:
            type: string
            pattern: '^AAS-\d{4}-\d{2}-\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*-\d{2}$'
          system:
            type: string
            minLength: 1
            pattern: '\S'
          run-date:
            type: string
            format: date
          result-disposition:
            enum: [complete, blocked, out-of-scope]
          target-class:
            type: [string, "null"]
            minLength: 1
          boundary-kind:
            enum:
              - whole-system
              - subsystem-only
              - "complete artifact, partial loop"
              - null
          reviewed-boundary:
            type: [string, "null"]
            minLength: 1
          analysis-cutoff:
            type: [string, "null"]
            format: date
          evidence-tier:
            enum: [code-grounded, doc-grounded, null]
          inputs-commit:
            type: string
            pattern: '^[0-9a-f]{40}$'
          members: false
        additionalProperties: true
      headings:
        description: "One H1 followed by the entry page's three ordered sections."
        type: array
        minItems: 4
        prefixItems:
          - pattern: '^# [^#].+$'
        items:
          anyOf:
            - enum:
                - "## Members"
                - "## Amendment index"
                - "## Deterministic validation"
            - pattern: '^#{3,6} .+$'
        allOf:
          - {contains: {const: "## Members"}, minContains: 1, maxContains: 1}
          - {contains: {const: "## Amendment index"}, minContains: 1, maxContains: 1}
          - {contains: {const: "## Deterministic validation"}, minContains: 1, maxContains: 1}
      body:
        allOf:
          - description: "The entry page sections appear in canonical reading order."
            pattern: '(?ms)^## Members\s*$.*?^## Amendment index\s*$.*?^## Deterministic validation\s*$'
  - if:
      properties:
        frontmatter:
          properties:
            result-disposition:
              const: complete
    then:
      properties:
        frontmatter:
          properties:
            target-class: {type: string, minLength: 1}
            boundary-kind: {enum: [whole-system, subsystem-only, "complete artifact, partial loop"]}
            reviewed-boundary: {type: string, minLength: 1}
            analysis-cutoff: {type: string, format: date}
            evidence-tier: {enum: [code-grounded, doc-grounded]}

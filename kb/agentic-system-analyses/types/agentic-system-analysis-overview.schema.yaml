$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "../../types/note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required:
          - description
          - type
          - run-id
          - system
          - run-date
          - result-disposition
          - target-class
          - boundary-kind
          - reviewed-boundary
          - analysis-cutoff
          - evidence-tier
          - inputs-commit
        properties:
          type:
            const: agentic-system-analyses/types/agentic-system-analysis-overview.md
          run-id:
            type: string
            pattern: '^AAS-\d{4}-\d{2}-\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*-\d{2}$'
          system:
            type: string
            minLength: 1
            pattern: '\S'
          run-date:
            type: string
            format: date
          result-disposition:
            enum: [complete, blocked, out-of-scope]
          target-class:
            type: [string, "null"]
            minLength: 1
          boundary-kind:
            enum:
              - whole-system
              - subsystem-only
              - "complete artifact, partial loop"
              - null
          reviewed-boundary:
            type: [string, "null"]
            minLength: 1
          analysis-cutoff:
            type: [string, "null"]
            format: date
          evidence-tier:
            enum: [code-grounded, doc-grounded, null]
          inputs-commit:
            type: string
            pattern: '^[0-9a-f]{40}$'
          members: false
        additionalProperties: true
      headings:
        description: "One H1 followed by five ordered overview sections; all three verification subheadings remain explicit in every disposition."
        type: array
        minItems: 11
        prefixItems:
          - pattern: '^# [^#].+$'
        items:
          anyOf:
            - enum:
                - "## Boundary and evidence"
                - "## Source register"
                - "## Bounded synthesis"
                - "## Limitations"
                - "## Verification and blockers"
            - pattern: '^#{3,6} .+$'
        allOf:
          - {contains: {const: "## Boundary and evidence"}, minContains: 1, maxContains: 1}
          - {contains: {const: "## Source register"}, minContains: 1, maxContains: 1}
          - {contains: {const: "## Bounded synthesis"}, minContains: 1, maxContains: 1}
          - {contains: {const: "## Limitations"}, minContains: 1, maxContains: 1}
          - {contains: {const: "## Verification and blockers"}, minContains: 1, maxContains: 1}
          - {contains: {const: "### Record verification"}, minContains: 1, maxContains: 1}
          - {contains: {const: "### Profile verification"}, minContains: 1, maxContains: 1}
          - {contains: {const: "### Synthesis verification"}, minContains: 1, maxContains: 1}
          - {contains: {const: "### Deterministic validation"}, minContains: 1, maxContains: 1}
          - {contains: {const: "### Blockers"}, minContains: 1, maxContains: 1}
      body:
        allOf:
          - description: "The five overview sections must appear in their canonical reading order."
            pattern: '(?ms)^## Boundary and evidence\s*$.*?^## Source register\s*$.*?^## Bounded synthesis\s*$.*?^## Limitations\s*$.*?^## Verification and blockers\s*$'
          - description: "Verification subheadings must appear under Verification and blockers in canonical order."
            pattern: '(?ms)^## Verification and blockers\s*$.*?^### Record verification\s*$.*?^### Profile verification\s*$.*?^### Synthesis verification\s*$.*?^### Deterministic validation\s*$.*?^### Blockers\s*$'
  - if:
      properties:
        frontmatter:
          properties:
            result-disposition:
              const: complete
    then:
      properties:
        frontmatter:
          properties:
            target-class: {type: string, minLength: 1}
            boundary-kind: {enum: [whole-system, subsystem-only, "complete artifact, partial loop"]}
            reviewed-boundary: {type: string, minLength: 1}
            analysis-cutoff: {type: string, format: date}
            evidence-tier: {enum: [code-grounded, doc-grounded]}

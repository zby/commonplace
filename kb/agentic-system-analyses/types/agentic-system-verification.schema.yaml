$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "../../types/note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required: [type, description, run-id, reviewed-boundary, verifies]
        properties:
          type:
            const: agentic-system-analyses/types/agentic-system-verification.md
          description:
            type: string
          run-id:
            type: string
            pattern: '^AAS-\d{4}-\d{2}-\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*-\d{2}$'
          reviewed-boundary:
            type: string
            minLength: 1
          verifies:
            enum: [records, profile, synthesis]
        additionalProperties: false
      headings:
        type: array
        minItems: 3
        prefixItems:
          - pattern: '^# [^#].+$'
        items:
          anyOf:
            - const: "## Verification"
            - const: "## Blockers"
            - pattern: '^#{3,6} .+$'
        allOf:
          - {contains: {const: "## Verification"}, minContains: 1, maxContains: 1}
          - {contains: {const: "## Blockers"}, minContains: 1, maxContains: 1}
      body:
        pattern: '(?ms)^## Verification\s*\n\s*\S.*^## Blockers\s*\n\s*\S'

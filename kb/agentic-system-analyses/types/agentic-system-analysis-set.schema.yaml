$schema: https://json-schema.org/draft/2020-12/schema
type: object
required:
- manifest
properties:
  manifest:
    type: object
    required:
    - type
    - members
    properties:
      type:
        const: agentic-system-analyses/types/agentic-system-analysis-set.md
      worker:
        type: object
        required:
        - profile
        - harness
        - launch-model
        - effort
        properties:
          profile:
            type: string
            minLength: 1
          harness:
            type: string
            minLength: 1
          launch-model:
            type: string
            minLength: 1
          effort:
            type: string
            minLength: 1
        additionalProperties: false
      members:
        type: object
        additionalProperties:
          type: object
          required:
          - sha256
          properties:
            sha256:
              type: string
              pattern: ^[0-9a-f]{64}$
          additionalProperties: false
    additionalProperties: false

# Explicit selection only. Read-mode checkout trial, not writing grants.
profiles:
  opus:
    harness: claude-code
    launch-model: opus
    effort: medium
    flags:
      tools: "Read,Grep,Glob,Write"
      allowed-tools: "Read,Grep,Glob,Write(kb/workflow-state/data/current/sub-worker/**)"
      disallowed-tools: "Bash,Edit,NotebookEdit,Agent,Task"
  codex:
    harness: codex
    launch-model: gpt-6.2-sol
    effort: medium
    flags:
      sandbox: workspace-write

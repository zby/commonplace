{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "allOf": [
    {
      "$ref": "./note.schema.yaml"
    },
    {
      "type": "object",
      "properties": {
        "frontmatter": {
          "type": "object",
          "required": [
            "type",
            "description",
            "run-id",
            "source-identity",
            "reviewed-boundary",
            "report-status",
            "memory-comparison"
          ],
          "properties": {
            "type": {
              "const": "types/agent-memory-analysis-report.md"
            },
            "description": {
              "type": "string",
              "minLength": 1
            },
            "run-id": {
              "type": "string",
              "pattern": "^AAS-\\d{4}-\\d{2}-\\d{2}-[a-z0-9]+(?:-[a-z0-9]+)*-\\d{2}$"
            },
            "source-identity": {
              "type": "string",
              "minLength": 1
            },
            "reviewed-boundary": {
              "type": "string",
              "minLength": 1
            },
            "report-status": {
              "enum": [
                "complete",
                "blocked"
              ]
            },
            "memory-comparison": {
              "type": "object",
              "required": [
                "scope",
                "axes"
              ],
              "properties": {
                "scope": {
                  "type": "string",
                  "minLength": 1
                },
                "axes": {
                  "type": "object",
                  "required": [
                    "storage_substrate",
                    "representational_form",
                    "lineage",
                    "behavioral_authority",
                    "write_agency",
                    "curation_operations",
                    "read_back_direction",
                    "read_back_signal",
                    "trace_learning",
                    "trace_source"
                  ],
                  "minProperties": 10,
                  "maxProperties": 10,
                  "additionalProperties": {
                    "type": "object",
                    "required": [
                      "assessment",
                      "evidence",
                      "values",
                      "records",
                      "note"
                    ],
                    "properties": {
                      "assessment": {
                        "enum": [
                          "known",
                          "partial",
                          "absent",
                          "inapplicable",
                          "uninspected",
                          "not-determinable"
                        ]
                      },
                      "values": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      },
                      "records": {
                        "type": "array",
                        "items": {
                          "type": "string"
                        }
                      },
                      "note": {
                        "type": "string",
                        "minLength": 1
                      },
                      "evidence": {
                        "type": "object",
                        "additionalProperties": {
                          "type": "object",
                          "required": [
                            "basis",
                            "records",
                            "note"
                          ],
                          "properties": {
                            "basis": {
                              "enum": [
                                "claimed",
                                "afforded",
                                "wired",
                                "observed",
                                "causally supported"
                              ]
                            },
                            "records": {
                              "type": "array",
                              "minItems": 1,
                              "uniqueItems": true,
                              "items": {
                                "type": "string"
                              }
                            },
                            "note": {
                              "type": "string",
                              "minLength": 1
                            }
                          },
                          "additionalProperties": false
                        }
                      }
                    },
                    "additionalProperties": false
                  }
                }
              },
              "additionalProperties": false
            }
          },
          "additionalProperties": false
        },
        "headings": {
          "type": "array",
          "allOf": [
            {
              "contains": {
                "const": "## Boundary and evidence"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Core ideas"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Shared records"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Write side"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Read-back"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Comparison rationale"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Integration issues"
              },
              "minContains": 1,
              "maxContains": 1
            },
            {
              "contains": {
                "const": "## Limitations and checks"
              },
              "minContains": 1,
              "maxContains": 1
            }
          ]
        }
      }
    }
  ]
}

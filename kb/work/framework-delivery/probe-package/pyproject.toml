[project]
name = "cp-delivery-probe"
version = "1.0.0"
description = "Throwaway probe: can a uv-installed package serve skills (through per-project stubs) and a Markdown library to agent harnesses in place?"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cp-delivery-probe-init = "cp_delivery_probe.cli:init"
cp-delivery-probe-library = "cp_delivery_probe.cli:library_root"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_delivery_probe"]

# The library installs as shared data, under <environment>/share/cp-delivery-probe/,
# a path that does not change with the Python version.
[tool.hatch.build.targets.wheel.shared-data]
"library" = "share/cp-delivery-probe"

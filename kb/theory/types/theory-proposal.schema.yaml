$schema: "https://json-schema.org/draft/2020-12/schema"
allOf:
  - $ref: "commonplace:types/note.schema.yaml"
  - type: object
    properties:
      frontmatter:
        type: object
        required:
          - description
          - type
        properties:
          type:
            const: notes/types/theory-proposal.md
          description:
            pattern: '^Proposal\b'
          tags:
            type: array
            maxItems: 0
        additionalProperties: true
